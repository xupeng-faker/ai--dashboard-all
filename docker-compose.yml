version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: ai_transform_mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: ai_transform
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 初始化脚本（必须保留，用于导入您的SQL文件）
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      # 数据持久化（改为本地目录映射，避免Docker卷缓存导致的启动失败）
      - ./docker/mysql/data:/var/lib/mysql
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    restart: always
